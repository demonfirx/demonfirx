name: Sync pinned repositories to Wild Cards

on:
  schedule:
    # Every three hours, halfway between scheduled snake refreshes.
    - cron: '32 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Both workflows write README.md. Serialize updates with the existing lock.
concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tools/sync-wild-cards.test.mjs
      - name: Fetch public pins and build linked cards
        run: node tools/sync-wild-cards.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
      - name: Publish changes to Wild Cards
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -A -- README.md assets/profile
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): sync Wild Cards with pinned repositories'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
