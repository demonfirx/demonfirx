name: Refresh profile and contribution snake

on:
  schedule:
    # 16 updates/day, every 90 minutes. Cron uses UTC; local times are WIB.
    # 00:17, 03:17, 06:17, 09:17, 12:17, 15:17, 18:17, 21:17 WIB.
    - cron: '17 2,5,8,11,14,17,20,23 * * *'
    # 01:47, 04:47, 07:47, 10:47, 13:47, 16:47, 19:47, 22:47 WIB.
    - cron: '47 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check public-data parsing
        run: node --test tools/profile.test.mjs
      - name: Refresh public statistics
        run: node bot.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
      - name: Animate the public contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3, MIT
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake.svg?palette=github-dark&color_snake=%23ff3654
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit the automatic refresh
        run: |
          git config user.name "Dewa Bagus Odie"
          git config user.email "18662743+demonfirx@users.noreply.github.com"
          git add README.md assets/generated
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(profile): refresh metrics and snake [automated]"
          git push
